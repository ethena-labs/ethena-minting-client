[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ethena-minting-client"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "web3==7.15.0",
    "python-dotenv==1.2.2",
    "hexbytes==1.3.1",
    "aiohttp>=3.14.4",
    "requests==2.33.0",
    "setuptools==83.0.0",
]

[tool.uv]
exclude-newer = "10 days"
# certifi exempt from cooldown for the emSign CA compromise patch; remove after 2026-11-01
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }
dev-dependencies = [
    "mypy",
    "types-requests",
]
override-dependencies = [
    "urllib3>=2.8.0",
    "idna>=3.15",
    "aiohttp>=3.14.4",  # GHSA-2g87-pp6c-29x5, GHSA-5wr8-gcqf-gqf3, GHSA-494j-54xm-rwp3
    "multidict>=6.9.1,<7",  # GHSA-54p9-h82j-f925 (stay on 6.x; 7.x is a major)
    "certifi>=2026.10.19",  # emSign CA compromise
]

[tool.ruff]
target-version = "py312"
line-length = 130

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "ERA", "PL", "TRY", "RUF"]
